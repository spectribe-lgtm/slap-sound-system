# Publikuje WYŁĄCZNIE aplikację (kalkulator opóźnień). Dokumentacja i materiały Seeburg nie są publikowane.
name: Deploy kalkulator opóźnień (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ["apps/delay-calculator/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Zbierz pliki aplikacji
        run: |
          mkdir _site
          cd apps/delay-calculator
          cp index.html sw.js manifest.webmanifest icon-192.png icon-512.png apple-touch-icon.png ../../_site/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
