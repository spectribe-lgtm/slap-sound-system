<title>Seeburg Delay</title>
<meta name="claude:viewport-fit-sides" content="cover">
{{HEAD_EXTRA}}
<style>
/* Układ: jeden ekran roboczy w stylu iOS (duży tytuł, grupy wstawione, pasek kart na dole).
   Tokeny poniżej to cały system designu: kolory systemowe, skala typografii Dynamic Type, odstępy, promienie. */
:root {
  --bg: #F2F2F7;
  --card: #FFFFFF;
  --label: #000000;
  --label-2: rgba(60,60,67,.6);
  --label-3: rgba(60,60,67,.3);
  --sep: rgba(60,60,67,.29);
  --fill: rgba(120,120,128,.12);
  --fill-strong: rgba(120,120,128,.2);
  --accent: #0088FF;
  --accent-text: #0071E3;
  --on-accent: #FFFFFF;
  --green: #248A3D;
  --orange: #C93400;
  --bar: rgba(249,249,249,.82);
  --shadow: 0 1px 3px rgba(0,0,0,.12), 0 0 0 .5px rgba(0,0,0,.04);

  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;

  --t-large: 34px;   /* Large Title 34/41 */
  --t-title2: 22px;  /* Title 2 22/28 */
  --t-body: 17px;    /* Body 17/22 */
  --t-sub: 15px;     /* Subhead 15/20 */
  --t-foot: 13px;    /* Footnote 13/18 */
  --t-cap: 12px;     /* Caption 12/16 */

  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px; --s-6: 32px;
  --r-card: 12px; --r-ctl: 9px; --row: 48px;
  --ease: cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --card: #1C1C1E; --label: #FFFFFF;
    --label-2: rgba(235,235,245,.6); --label-3: rgba(235,235,245,.3);
    --sep: rgba(84,84,88,.6); --fill: rgba(120,120,128,.24); --fill-strong: rgba(120,120,128,.36);
    --accent: #0091FF; --accent-text: #409CFF; --green: #30D158; --orange: #FF9F0A;
    --bar: rgba(30,30,30,.82); --shadow: 0 0 0 .5px rgba(255,255,255,.06);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --card: #1C1C1E; --label: #FFFFFF;
  --label-2: rgba(235,235,245,.6); --label-3: rgba(235,235,245,.3);
  --sep: rgba(84,84,88,.6); --fill: rgba(120,120,128,.24); --fill-strong: rgba(120,120,128,.36);
  --accent: #0091FF; --accent-text: #409CFF; --green: #30D158; --orange: #FF9F0A;
  --bar: rgba(30,30,30,.82); --shadow: 0 0 0 .5px rgba(255,255,255,.06);
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--label);
  font: 400 var(--t-body)/22px var(--font);
  -webkit-font-smoothing: antialiased;
  padding-block: 0 112px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 560px; margin: 0 auto; }
[hidden] { display: none !important; }

h1 { font: 700 var(--t-large)/41px var(--font); margin: 0; padding: var(--s-5) 0 var(--s-3); }
.group-title {
  font: 400 var(--t-foot)/18px var(--font); color: var(--label-2);
  text-transform: uppercase; margin: var(--s-5) 0 6px; padding-left: var(--s-4);
  letter-spacing: .02em;
}
.group-foot { font: 400 var(--t-foot)/18px var(--font); color: var(--label-2); margin: 6px 0 0; padding: 0 var(--s-4); }
.group {
  background: var(--card); border-radius: var(--r-card); overflow: hidden;
  display: grid;
}
.row {
  display: flex; align-items: center; justify-content: space-between; gap: var(--s-3);
  min-height: var(--row); padding: 6px var(--s-4); position: relative; min-width: 0;
}
.row + .row::before {
  content: ""; position: absolute; top: 0; left: var(--s-4); right: 0; height: .5px; background: var(--sep);
}
.row > .k { flex: 0 0 auto; color: var(--label); }
.row > .v { flex: 1 1 auto; min-width: 0; text-align: right; color: var(--label-2); }
.row.block { flex-direction: column; align-items: stretch; justify-content: center; gap: 0; padding-block: 10px; }

/* Wybór modelu: natywny select, wygląda jak wartość końcowa wiersza */
.pick { position: relative; flex: 1 1 auto; min-width: 0; display: flex; justify-content: flex-end; align-items: center; gap: 4px; }
.pick select {
  appearance: none; -webkit-appearance: none; background: transparent; border: 0; outline: 0;
  font: inherit; color: var(--accent-text); text-align: right; text-align-last: right;
  padding: 10px 0; max-width: 100%; cursor: pointer;
}
.pick .chev { color: var(--label-3); width: 8px; height: 14px; flex: 0 0 auto; pointer-events: none; }

/* Pole liczbowe + krokowiec */
.num { display: flex; align-items: center; gap: var(--s-3); flex: 1 1 auto; justify-content: flex-end; min-width: 0; }
.num input {
  width: 5.2em; min-width: 0; text-align: right; border: 0; outline: 0; background: transparent;
  font: 400 var(--t-body)/22px var(--font); color: var(--label); padding: 10px 0;
  font-variant-numeric: tabular-nums;
}
.num input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.num .u { color: var(--label-2); min-width: 1.6em; }
.stepper { display: inline-flex; background: var(--fill); border-radius: var(--r-ctl); height: 32px; flex: 0 0 auto; }
.stepper button {
  width: 46px; border: 0; background: transparent; color: var(--label); font: 400 22px/1 var(--font);
  cursor: pointer; border-radius: var(--r-ctl); touch-action: manipulation;
}
.stepper button + button { position: relative; }
.stepper button + button::before { content: ""; position: absolute; left: 0; top: 7px; bottom: 7px; width: .5px; background: var(--label-3); }
.stepper button:active { background: var(--fill-strong); }
.stepper button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

/* Segmentowany przełącznik */
.seg { display: flex; background: var(--fill); border-radius: var(--r-ctl); padding: 2px; gap: 2px; }
.seg label { flex: 1 1 0; min-width: 0; position: relative; }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.seg span {
  display: block; text-align: center; padding: 5px 4px; border-radius: 7px;
  font: 500 var(--t-sub)/20px var(--font); color: var(--label);
  transition: background .2s var(--ease), box-shadow .2s var(--ease);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.seg input:checked + span { background: var(--card); box-shadow: var(--shadow); font-weight: 600; }
:root[data-theme="dark"] .seg input:checked + span { background: #636366; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .seg input:checked + span { background: #636366; } }
.seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 1px; }

/* Wynik */
.result { background: var(--card); border-radius: var(--r-card); padding: var(--s-4); }
.result .cap { font: 400 var(--t-foot)/18px var(--font); color: var(--label-2); text-transform: uppercase; letter-spacing: .02em; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-3); margin-top: var(--s-2); }
.tile { border-radius: 10px; padding: var(--s-3) var(--s-4); background: var(--fill); min-width: 0; }
.tile .who { font: 600 var(--t-sub)/20px var(--font); color: var(--label-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .val { font: 700 38px/44px var(--font); font-variant-numeric: tabular-nums; letter-spacing: -.01em; color: var(--label-2); }
.tile .val small { font: 600 var(--t-sub)/20px var(--font); margin-left: 4px; }
.tile .hint { font: 400 var(--t-cap)/16px var(--font); color: var(--label-2); }
.tile.on { background: var(--accent); }
.tile.on .who, .tile.on .hint, .tile.on .val { color: var(--on-accent); }
.dsp { margin: var(--s-3) 0 0; font: 400 var(--t-foot)/18px var(--font); color: var(--label-2); font-variant-numeric: tabular-nums; }
.dsp b { color: var(--label); font-weight: 600; }
.warn { margin: var(--s-3) 0 0; font: 400 var(--t-foot)/18px var(--font); color: var(--orange); }
.btn {
  display: block; width: 100%; margin-top: var(--s-3); border: 0; border-radius: 12px; cursor: pointer;
  background: var(--accent); color: var(--on-accent); font: 600 var(--t-body)/22px var(--font);
  padding: 13px; touch-action: manipulation; transition: opacity .15s var(--ease), transform .15s var(--ease);
}
.btn:active { opacity: .6; transform: scale(.985); }
.btn:focus-visible { outline: 3px solid var(--accent-text); outline-offset: 2px; }

.mono { font-variant-numeric: tabular-nums; }
.pos { color: var(--label); }

/* Pasek kart */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--bar); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  border-top: .5px solid var(--sep);
  padding: 6px max(8px, env(safe-area-inset-left, 0px)) calc(4px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-right, 0px));
}
.tabbar .in { display: grid; grid-template-columns: repeat(3, 1fr); max-width: 560px; margin: 0 auto; }
.tab {
  border: 0; background: transparent; color: var(--label-2); cursor: pointer; padding: 4px 0 2px;
  display: grid; justify-items: center; gap: 2px; font: 500 10px/12px var(--font); min-height: 49px; touch-action: manipulation;
}
.tab svg { width: 28px; height: 28px; }
.tab[aria-selected="true"] { color: var(--accent-text); }
.tab:focus-visible { outline: 2px solid var(--accent); border-radius: 8px; }

/* Baza */
details.model { background: var(--card); }
details.model + details.model { border-top: .5px solid var(--sep); }
details.model summary {
  list-style: none; cursor: pointer; padding: 10px var(--s-4); min-height: 56px;
  display: flex; align-items: center; justify-content: space-between; gap: var(--s-3);
}
details.model summary::-webkit-details-marker { display: none; }
details.model summary .n { font-weight: 600; }
details.model summary .s { font: 400 var(--t-sub)/20px var(--font); color: var(--label-2); }
details.model summary .chev { color: var(--label-3); width: 8px; height: 14px; flex: 0 0 auto; transition: transform .25s var(--ease); }
details.model[open] summary .chev { transform: rotate(90deg); }
details.model .body { padding: 0 var(--s-4) var(--s-4); }
dl.spec { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 0; }
dl.spec dt, dl.spec dd { margin: 0; padding: 6px 0; border-top: .5px solid var(--sep); font: 400 var(--t-sub)/20px var(--font); }
dl.spec dt { color: var(--label-2); }
dl.spec dd { text-align: right; padding-left: var(--s-4); font-variant-numeric: tabular-nums; }
.presets { margin-top: var(--s-3); }
.presets h3 { margin: 0 0 4px; font: 600 var(--t-sub)/20px var(--font); }
.presets p { margin: 0; padding: 6px 0; border-top: .5px solid var(--sep); font: 400 var(--t-foot)/18px var(--font); color: var(--label-2); }
.presets p b { color: var(--label); font-weight: 600; }

.prose { background: var(--card); border-radius: var(--r-card); padding: var(--s-4); }
.prose h2 { font: 600 var(--t-body)/22px var(--font); margin: var(--s-4) 0 4px; }
.prose h2:first-child { margin-top: 0; }
.prose p, .prose li { font: 400 var(--t-sub)/21px var(--font); color: var(--label-2); margin: 0 0 8px; }
.prose ul { padding-left: 20px; margin: 0 0 8px; }
.prose code { font: 400 14px/20px var(--mono); color: var(--label); background: var(--fill); padding: 1px 5px; border-radius: 5px; }
.formula { font: 400 14px/21px var(--mono); color: var(--label); background: var(--fill); border-radius: 8px; padding: 10px 12px; overflow-x: auto; white-space: pre; margin: 4px 0 8px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@media (max-width: 380px) { .tile .val { font-size: 32px; line-height: 38px; } }
